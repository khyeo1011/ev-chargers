# API: 2 replicas behind a Service, reachable on any node at port 30080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ev-chargers
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ev-chargers-api:dev
          imagePullPolicy: IfNotPresent # image is imported onto the nodes, not pulled
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: aws-config # created from .env, see README
          env:
            - name: PORT
              value: "8080"
          # Readiness: only send traffic once the pod answers.
          # Liveness: restart the container if it stops answering.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ev-chargers
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
