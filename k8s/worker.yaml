# Worker: scale replicas up and SQS spreads messages across them automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ev-chargers
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      # Give in-flight messages time to finish after SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ev-chargers-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: aws-config
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
